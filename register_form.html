<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BISE Faisalabad - Register</title>
    <style>
      body {
        color: #333;
        background-color: white;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      .container {
        margin: auto 23px;
        border: 0;
      }
      .row {
        background-color: #01455e;
        padding: 6px 15px;
      }
      .brand {
        text-align: center;
        font-family: Verdana, Geneva, Tahoma, sans-serif;
        font-weight: bold;
        color: white;
      }
      .address-bar {
        text-align: center;
        color: white;
        font-weight: 400;
        font-family: Verdana, Geneva, Tahoma, sans-serif;
        text-transform: uppercase;
        letter-spacing: 3px;
      }

      a {
        text-decoration: none;
        color: white;
        display: inline-block;
      }
      a:hover {
        background-color: white;
        color: black;
      }
      a:focus {
        color: black;
      }
      hr {
        border: 2px;
        color: white;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="container">
        <div class="row">
          <div class="brand">
            Board of Intermediate & Secondary Education, Faisalabad
          </div>
          <div class="address-bar">Application Form for New Affiliation</div>
        </div>
      </div>
      <hr />
      <div class="container">
        <div class="row">
          <nav>
            <ul>
              <li>
                <a href="index.html">Home</a>
              </li>
              <li>
                <a href="login.html">Login</a>
              </li>
              <li>
                <a href="contact.html">Contact</a>
              </li>
            </ul>
          </nav>
        </div>
      </div>
    </header>
  </body>
</html>
